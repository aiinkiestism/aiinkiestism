      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">        ],</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">        </tspan><tspan fill="#c9d1d9">plays</tspan><tspan fill="#8b949e">:   </tspan><tspan fill="#d2a8ff">vec!</tspan><tspan fill="#8b949e">[</tspan><tspan fill="#79c0ff">Piano</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#79c0ff">Guitar</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#79c0ff">Vocal</tspan><tspan fill="#8b949e">],</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">        </tspan><tspan fill="#c9d1d9">mind</tspan><tspan fill="#8b949e">:    </tspan><tspan fill="#79c0ff">Agnostic</tspan><tspan fill="#8b949e"> | </tspan><tspan fill="#79c0ff">Opinionated</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">               | </tspan><tspan fill="#79c0ff">IndieHack</tspan><tspan fill="#8b949e"> | </tspan><tspan fill="#79c0ff">Modular</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">               | </tspan><tspan fill="#79c0ff">Cooperative</tspan><tspan fill="#8b949e">,</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">        </tspan><tspan fill="#c9d1d9">site</tspan><tspan fill="#8b949e">:    </tspan><tspan fill="#d2a8ff">url!</tspan><tspan fill="#8b949e">(</tspan><tspan fill="#a5d6ff">"hashmimic.com"</tspan><tspan fill="#8b949e">),</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">        </tspan><tspan fill="#c9d1d9">company</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#d2a8ff">url!</tspan><tspan fill="#8b949e">(</tspan><tspan fill="#a5d6ff">"unchainedx.io"</tspan><tspan fill="#8b949e">),</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">    };</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">    </tspan><tspan fill="#ff7b72">loop</tspan><tspan fill="#8b949e"> {</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">        me.</tspan><tspan fill="#d2a8ff">ship</tspan><tspan fill="#8b949e">(</tspan><tspan fill="#a5d6ff">"300 Time for Cookie"</tspan><tspan fill="#8b949e">);</tspan></tspan>
      <tspan x="547" dy="15.4" xml:space="preserve"><tspan fill="#8b949e">    }</tspan></tspan>
