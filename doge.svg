      <stop offset="0" stop-color="#fe428e" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#fe428e" stop-opacity="0"/>
    </radialGradient>
    <!-- cyan glow (bottom-right) -->
    <radialGradient id="gCyan" cx="0.8" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#59e7ff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#59e7ff" stop-opacity="0"/>
    </radialGradient>
    <!-- central pulsing glow -->
