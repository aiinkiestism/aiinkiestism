<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 366" width="416" height="366" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">
  <defs>
    <!-- rounded clip -->
    <clipPath id="round"><rect x="0" y="0" width="416" height="366" rx="9"/></clipPath>
    <!-- base purple gradient -->
